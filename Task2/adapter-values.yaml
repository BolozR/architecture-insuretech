prometheus:
  url: http://prometheus.sprint8.svc.cluster.local
  port: 9090

metricsRelistInterval: 30s

rules:
  default: false
  custom:
    - seriesQuery: 'http_requests_total{namespace="sprint8",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: ^http_requests_total$
        as: http_requests_per_second
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
